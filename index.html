<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Pen 3D Viewer</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0d0d0d;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff}
    #wrap{position:fixed;inset:0}
    canvas{display:block;width:100%!important;height:100%!important}

    /* 로딩 */
    #loading{position:fixed;inset:0;background:#0d0d0d;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100}
    .spin{width:36px;height:36px;border:2px solid #222;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin-bottom:18px}
    @keyframes spin{to{transform:rotate(360deg)}}
    #bar-wrap{width:180px;height:2px;background:#1e1e1e;border-radius:2px;margin-bottom:10px}
    #bar{height:100%;background:#fff;border-radius:2px;width:0%;transition:width .2s}
    #load-txt{font-size:10px;opacity:.35;letter-spacing:3px;text-transform:uppercase}

    /* 타이틀 */
    #title{position:fixed;top:22px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:6px;text-transform:uppercase;opacity:.25;z-index:10;pointer-events:none}

    /* 배경 선택 */
    #bg-wrap{position:fixed;top:20px;right:20px;display:flex;gap:6px;align-items:center;z-index:10}
    #bg-wrap label{font-size:9px;opacity:.25;letter-spacing:2px;text-transform:uppercase;margin-right:2px}
    .bdot{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .15s,transform .15s}
    .bdot:hover{transform:scale(1.25)}
    .bdot.on{border-color:#fff}

    /* 뷰 프리셋 */
    #presets{position:fixed;left:20px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px;z-index:10}
    .pbt{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.45);padding:6px 10px;border-radius:5px;font-size:9px;cursor:pointer;letter-spacing:1px;transition:all .15s;text-align:center;backdrop-filter:blur(8px)}
    .pbt:hover{background:rgba(255,255,255,.14);color:#fff}

    /* 하단 버튼 */
    #bottom{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;z-index:10}
    .btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);color:rgba(255,255,255,.65);padding:9px 17px;border-radius:7px;font-size:11px;cursor:pointer;letter-spacing:.5px;transition:background .15s;backdrop-filter:blur(10px);white-space:nowrap}
    .btn:hover{background:rgba(255,255,255,.15)}
    .btn.render-btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff;font-weight:500}
    .btn.render-btn:hover{background:rgba(255,255,255,.22)}
    .btn.render-btn:active{transform:scale(.97)}

    /* 렌더 진행 오버레이 */
    #render-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px)}
    #render-overlay.show{display:flex}
    #render-msg{font-size:12px;letter-spacing:4px;opacity:.8;text-transform:uppercase}

    /* 힌트 */
    #hint{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);font-size:10px;opacity:0;letter-spacing:2px;color:rgba(255,255,255,.3);transition:opacity .5s;pointer-events:none;white-space:nowrap}
    #hint.show{opacity:1}

    /* GLB 업로드 안내 */
    #glb-note{position:fixed;bottom:28px;right:20px;font-size:9px;opacity:.18;letter-spacing:1px;z-index:10;text-align:right;line-height:1.6}
  </style>
</head>
<body>
<div id="wrap"></div>
<div id="loading">
  <div class="spin"></div>
  <div id="bar-wrap"><div id="bar"></div></div>
  <div id="load-txt">loading...</div>
</div>
<div id="title">Smart Pen &nbsp;·&nbsp; 3D Viewer</div>
<div id="bg-wrap">
  <label>BG</label>
  <div class="bdot on" style="background:#0d0d0d" data-color="#0d0d0d" data-fog="13,13,13"></div>
  <div class="bdot" style="background:#1c1c1e" data-color="#1c1c1e" data-fog="28,28,30"></div>
  <div class="bdot" style="background:#f5f5f7;border-color:#ccc" data-color="#f5f5f7" data-fog="245,245,247"></div>
  <div class="bdot" style="background:#0a192f" data-color="#0a192f" data-fog="10,25,47"></div>
</div>
<div id="presets">
  <div class="pbt" data-view="front">정면</div>
  <div class="pbt" data-view="back">뒷면</div>
  <div class="pbt" data-view="left">좌측</div>
  <div class="pbt" data-view="right">우측</div>
  <div class="pbt" data-view="top">탑뷰</div>
  <div class="pbt" data-view="iso">아이소</div>
</div>
<div id="hint">드래그: 회전 &nbsp;|&nbsp; 스크롤: 줌 &nbsp;|&nbsp; 우클릭: 이동</div>
<div id="bottom">
  <button class="btn" id="reset-btn">↺ 리셋</button>
  <button class="btn" id="wire-btn">◻ 와이어프레임</button>
  <button class="btn render-btn" id="render-btn">⬇ 렌더 이미지 저장</button>
</div>
<div id="glb-note">smartpen.glb<br>jaykim12345/smartpen-viewer</div>

<div id="render-overlay"><div id="render-msg">rendering...</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script>
// ── 렌더러 ───────────────────────────────────────────────
const wrap = document.getElementById('wrap');
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  preserveDrawingBuffer: true   // 렌더 캡처용
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);

// ── 씬 / 카메라 ─────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d0d);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.001, 1000);

// ── 스튜디오 환경맵 (PBR 반사) ──────────────────────────
function makeEnvMap() {
  const W = 1024, H = 512;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');

  // 베이스: 중간 회색
  ctx.fillStyle = '#c8cace';
  ctx.fillRect(0, 0, W, H);

  // 키라이트 (왼쪽 상단, 밝은 흰색)
  const g1 = ctx.createRadialGradient(W*0.15, H*0.2, 0, W*0.15, H*0.2, W*0.45);
  g1.addColorStop(0, 'rgba(255,255,255,1)');
  g1.addColorStop(0.4, 'rgba(245,247,255,0.7)');
  g1.addColorStop(1, 'rgba(200,202,206,0)');
  ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H);

  // 필라이트 (오른쪽)
  const g2 = ctx.createRadialGradient(W*0.85, H*0.5, 0, W*0.85, H*0.5, W*0.35);
  g2.addColorStop(0, 'rgba(220,228,245,0.8)');
  g2.addColorStop(1, 'rgba(200,202,206,0)');
  ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);

  // 림라이트 (뒤쪽 상단)
  const g3 = ctx.createRadialGradient(W*0.5, H*0.05, 0, W*0.5, H*0.05, W*0.25);
  g3.addColorStop(0, 'rgba(255,255,255,0.9)');
  g3.addColorStop(1, 'rgba(200,202,206,0)');
  ctx.fillStyle = g3; ctx.fillRect(0, 0, W, H);

  // 바닥 반사 (하단)
  const g4 = ctx.createRadialGradient(W*0.5, H*0.95, 0, W*0.5, H*0.95, W*0.3);
  g4.addColorStop(0, 'rgba(180,185,195,0.6)');
  g4.addColorStop(1, 'rgba(200,202,206,0)');
  ctx.fillStyle = g4; ctx.fillRect(0, 0, W, H);

  const tex = new THREE.CanvasTexture(cv);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const env = pmrem.fromEquirectangular(tex).texture;
  tex.dispose(); pmrem.dispose();
  return env;
}
const envMap = makeEnvMap();
scene.environment = envMap;

// ── 조명 (스튜디오 3점 조명) ────────────────────────────
const amb = new THREE.AmbientLight(0xffffff, 0.08);
scene.add(amb);

const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(3, 8, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.1;
key.shadow.camera.far = 50;
key.shadow.camera.left = key.shadow.camera.bottom = -3;
key.shadow.camera.right = key.shadow.camera.top = 3;
key.shadow.bias = -0.001;
scene.add(key);

const fill = new THREE.DirectionalLight(0xd0e0ff, 0.4);
fill.position.set(-4, 2, 3);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 0.6);
rim.position.set(0, 3, -6);
scene.add(rim);

const bot = new THREE.DirectionalLight(0x8090a0, 0.15);
bot.position.set(0, -5, 0);
scene.add(bot);

// ── 카메라 컨트롤 ────────────────────────────────────────
let sph = {theta: 0.3, phi: Math.PI/2, r: 3};
let tgt = {...sph};
let pan = {x:0,y:0}, tpan = {x:0,y:0};

function updateCam() {
  sph.theta += (tgt.theta - sph.theta) * 0.1;
  sph.phi   += (tgt.phi   - sph.phi  ) * 0.1;
  sph.r     += (tgt.r     - sph.r    ) * 0.1;
  pan.x += (tpan.x - pan.x) * 0.1;
  pan.y += (tpan.y - pan.y) * 0.1;
  const x = sph.r * Math.sin(sph.phi) * Math.sin(sph.theta);
  const y = sph.r * Math.cos(sph.phi);
  const z = sph.r * Math.sin(sph.phi) * Math.cos(sph.theta);
  camera.position.set(x + pan.x, y + pan.y, z);
  camera.lookAt(pan.x, pan.y, 0);
}

const cv = renderer.domElement;
let drag = false, rightDrag = false, px = 0, py = 0;
cv.addEventListener('mousedown', e => { drag = true; rightDrag = e.button === 2; px = e.clientX; py = e.clientY; });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('mousemove', e => {
  if (!drag) return;
  const dx = e.clientX - px, dy = e.clientY - py; px = e.clientX; py = e.clientY;
  if (rightDrag) { const s = 0.002 * sph.r; tpan.x -= dx*s; tpan.y += dy*s; }
  else { tgt.theta -= dx*0.007; tgt.phi = Math.max(0.05, Math.min(Math.PI-0.05, tgt.phi - dy*0.007)); }
});
window.addEventListener('mouseup', () => drag = false);
cv.addEventListener('wheel', e => {
  e.preventDefault();
  tgt.r = Math.max(0.2, Math.min(15, tgt.r * (1 + e.deltaY * 0.001)));
}, {passive:false});

let touches = [];
cv.addEventListener('touchstart', e => { touches = [...e.touches]; }, {passive:true});
cv.addEventListener('touchmove', e => {
  if (e.touches.length === 1) {
    const dx = e.touches[0].clientX - touches[0].clientX;
    const dy = e.touches[0].clientY - touches[0].clientY;
    tgt.theta -= dx*0.007; tgt.phi = Math.max(0.05, Math.min(Math.PI-0.05, tgt.phi - dy*0.007));
  } else if (e.touches.length === 2) {
    const pd = Math.hypot(touches[0].clientX-touches[1].clientX, touches[0].clientY-touches[1].clientY);
    const nd = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    tgt.r = Math.max(0.2, Math.min(15, tgt.r * pd/nd));
  }
  touches = [...e.touches];
}, {passive:true});

// ── GLB 로드 ─────────────────────────────────────────────
const draco = new THREE.DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
const loader = new THREE.GLTFLoader();
loader.setDRACOLoader(draco);

loader.load('smartpen.glb',
  gltf => {
    const m = gltf.scene;

    // 크기/중심 정규화
    const box = new THREE.Box3().setFromObject(m);
    const sz = box.getSize(new THREE.Vector3());
    const cn = box.getCenter(new THREE.Vector3());
    const sc = 2.0 / Math.max(sz.x, sz.y, sz.z);
    m.scale.setScalar(sc);
    m.position.sub(cn.multiplyScalar(sc));

    // 그림자 활성화
    m.traverse(c => {
      if (c.isMesh) {
        c.castShadow = true;
        c.receiveShadow = true;
        // 환경맵 반사 강도 보정 (metalness 소재에 잘 반영되도록)
        if (c.material) {
          const mats = Array.isArray(c.material) ? c.material : [c.material];
          mats.forEach(mat => {
            if (mat.envMap === undefined) mat.envMapIntensity = 1.5;
          });
        }
      }
    });

    scene.add(m);
    window._model = m;
    tgt.r = sph.r = 2.8;

    document.getElementById('loading').style.display = 'none';
    const h = document.getElementById('hint');
    h.classList.add('show');
    setTimeout(() => h.classList.remove('show'), 3500);
  },
  p => {
    if (p.total > 0) {
      const pct = p.loaded / p.total * 100;
      document.getElementById('bar').style.width = pct + '%';
      document.getElementById('load-txt').textContent = `loading ${Math.round(pct)}%`;
    }
  },
  e => { document.getElementById('load-txt').textContent = '오류: ' + e.message; }
);

// ── 뷰 프리셋 ────────────────────────────────────────────
const VIEWS = {
  front: {t:0,      p:Math.PI/2,   r:2.8},
  back:  {t:Math.PI,p:Math.PI/2,   r:2.8},
  left:  {t:-Math.PI/2, p:Math.PI/2, r:2.8},
  right: {t:Math.PI/2,  p:Math.PI/2, r:2.8},
  top:   {t:0,      p:0.05,        r:2.8},
  iso:   {t:Math.PI/4, p:Math.PI/3, r:3.2}
};
document.querySelectorAll('.pbt').forEach(b => b.addEventListener('click', () => {
  const v = VIEWS[b.dataset.view];
  if (v) { tgt.theta=v.t; tgt.phi=v.p; tgt.r=v.r; tpan={x:0,y:0}; }
}));

// ── 리셋 ─────────────────────────────────────────────────
document.getElementById('reset-btn').addEventListener('click', () => {
  tgt = {theta:0.3, phi:Math.PI/2, r:2.8};
  tpan = {x:0, y:0};
});

// ── 와이어프레임 ─────────────────────────────────────────
let wire = false;
document.getElementById('wire-btn').addEventListener('click', () => {
  wire = !wire;
  if (window._model) window._model.traverse(c => {
    if (c.isMesh && c.material) {
      (Array.isArray(c.material)?c.material:[c.material]).forEach(m => m.wireframe = wire);
    }
  });
  document.getElementById('wire-btn').textContent = wire ? '● 솔리드' : '◻ 와이어프레임';
});

// ── 배경색 ───────────────────────────────────────────────
document.querySelectorAll('.bdot').forEach(d => d.addEventListener('click', () => {
  document.querySelectorAll('.bdot').forEach(x => x.classList.remove('on'));
  d.classList.add('on');
  const col = d.dataset.color;
  scene.background = new THREE.Color(col);
  document.body.style.background = col;
}));

// ── 렌더 이미지 저장 (4K) ────────────────────────────────
document.getElementById('render-btn').addEventListener('click', async () => {
  const overlay = document.getElementById('render-overlay');
  const msg = document.getElementById('render-msg');
  overlay.classList.add('show');
  msg.textContent = 'rendering...';

  // 한 프레임 대기
  await new Promise(r => setTimeout(r, 80));

  const SCALE = 4;
  const W = innerWidth * SCALE;
  const H = innerHeight * SCALE;

  // 고해상도로 리사이즈
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();

  // 강제 렌더
  updateCam();
  renderer.render(scene, camera);

  await new Promise(r => setTimeout(r, 50));

  // PNG 다운로드
  const url = renderer.domElement.toDataURL('image/png');
  const a = document.createElement('a');
  a.download = 'smartpen_render.png';
  a.href = url;
  a.click();

  // 원래 사이즈로 복구
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();

  msg.textContent = '저장 완료!';
  setTimeout(() => overlay.classList.remove('show'), 1200);
});

// ── 리사이즈 ─────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── 애니메이션 루프 ──────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  updateCam();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
