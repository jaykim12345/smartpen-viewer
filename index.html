<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Pen 3D Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: white; }
    #canvas-wrap { position: fixed; inset: 0; }
    canvas { display: block; width: 100% !important; height: 100% !important; }
    #loading { position: fixed; inset: 0; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; }
    .spin { width: 40px; height: 40px; border: 2px solid #222; border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #load-bar-wrap { width: 200px; height: 2px; background: #222; border-radius: 2px; margin-bottom: 10px; }
    #load-bar { height: 100%; background: white; border-radius: 2px; width: 0%; transition: width 0.2s; }
    #load-text { font-size: 11px; opacity: 0.4; letter-spacing: 2px; }
    #ui { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; z-index: 10; }
    .btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.7); padding: 9px 16px; border-radius: 7px; font-size: 11px; cursor: pointer; letter-spacing: 1px; transition: background 0.15s; backdrop-filter: blur(10px); }
    .btn:hover { background: rgba(255,255,255,0.15); }
    #top-ui { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 10; }
    #title { font-size: 11px; letter-spacing: 5px; text-transform: uppercase; opacity: 0.35; }
    #bg-wrap { position: fixed; top: 24px; right: 24px; display: flex; gap: 7px; align-items: center; z-index: 10; }
    #bg-wrap span { font-size: 9px; opacity: 0.3; letter-spacing: 2px; text-transform: uppercase; margin-right: 3px; }
    .bdot { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: border-color 0.15s, transform 0.15s; }
    .bdot:hover { transform: scale(1.2); }
    .bdot.on { border-color: white; }
    #presets { position: fixed; left: 24px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 10; }
    .preset-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); padding: 6px 10px; border-radius: 5px; font-size: 9px; cursor: pointer; letter-spacing: 1px; transition: background 0.15s, color 0.15s; backdrop-filter: blur(10px); text-align: center; }
    .preset-btn:hover { background: rgba(255,255,255,0.15); color: white; }
    #hint { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); font-size: 10px; opacity: 0; letter-spacing: 2px; color: rgba(255,255,255,0.35); transition: opacity 0.5s; pointer-events: none; white-space: nowrap; }
    #hint.show { opacity: 1; }
  </style>
</head>
<body>
<div id="canvas-wrap"></div>
<div id="loading">
  <div class="spin"></div>
  <div id="load-bar-wrap"><div id="load-bar"></div></div>
  <div id="load-text">로딩중...</div>
</div>
<div id="top-ui"><div id="title">Smart Pen · 3D Viewer</div></div>
<div id="bg-wrap">
  <span>BG</span>
  <div class="bdot on" style="background:#111" data-color="#111"></div>
  <div class="bdot" style="background:#fff;border-color:#333" data-color="#fff"></div>
  <div class="bdot" style="background:#1a1a2e" data-color="#1a1a2e"></div>
  <div class="bdot" style="background:#f0f0f0;border-color:#333" data-color="#f0f0f0"></div>
</div>
<div id="presets">
  <div class="preset-btn" data-view="front">정면</div>
  <div class="preset-btn" data-view="back">뒷면</div>
  <div class="preset-btn" data-view="left">좌측</div>
  <div class="preset-btn" data-view="right">우측</div>
  <div class="preset-btn" data-view="top">탑</div>
  <div class="preset-btn" data-view="iso">아이소</div>
</div>
<div id="hint">드래그: 회전 &nbsp;|&nbsp; 스크롤: 줌 &nbsp;|&nbsp; 우클릭: 이동</div>
<div id="ui">
  <button class="btn" id="reset-btn">↺ 리셋</button>
  <button class="btn" id="wire-btn">◻ 와이어프레임</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script>
const wrap = document.getElementById('canvas-wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.01, 1000);
camera.position.set(0,0,3);

function createEnvMap() {
  const W=512,H=256,cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#e2e3e7'; ctx.fillRect(0,0,W,H);
  const g1=ctx.createRadialGradient(80,55,0,80,55,220);
  g1.addColorStop(0,'rgba(255,255,255,1)'); g1.addColorStop(1,'rgba(226,227,231,0)');
  ctx.fillStyle=g1; ctx.fillRect(0,0,W,H);
  const g2=ctx.createRadialGradient(430,130,0,430,130,160);
  g2.addColorStop(0,'rgba(240,243,250,0.75)'); g2.addColorStop(1,'rgba(226,227,231,0)');
  ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);
  const g3=ctx.createRadialGradient(256,15,0,256,15,110);
  g3.addColorStop(0,'rgba(255,255,255,0.65)'); g3.addColorStop(1,'rgba(226,227,231,0)');
  ctx.fillStyle=g3; ctx.fillRect(0,0,W,H);
  const tex=new THREE.CanvasTexture(cv);
  tex.mapping=THREE.EquirectangularReflectionMapping;
  const pmrem=new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const env=pmrem.fromEquirectangular(tex).texture;
  tex.dispose(); pmrem.dispose(); return env;
}
scene.environment=createEnvMap();

scene.add(new THREE.AmbientLight(0xffffff,0.15));
const dl1=new THREE.DirectionalLight(0xffffff,0.8); dl1.position.set(5,10,5); scene.add(dl1);
const dl2=new THREE.DirectionalLight(0xffffff,0.3); dl2.position.set(-5,-5,-5); scene.add(dl2);
const dl3=new THREE.DirectionalLight(0xffffff,0.15); dl3.position.set(0,5,-10); scene.add(dl3);

let isDragging=false,isRight=false,prevX=0,prevY=0;
let sph={theta:0.3,phi:Math.PI/2.5,radius:3},tgt={...sph};
let pan={x:0,y:0},tpan={x:0,y:0};

function updateCam() {
  sph.theta+=(tgt.theta-sph.theta)*0.12;
  sph.phi+=(tgt.phi-sph.phi)*0.12;
  sph.radius+=(tgt.radius-sph.radius)*0.12;
  pan.x+=(tpan.x-pan.x)*0.12; pan.y+=(tpan.y-pan.y)*0.12;
  const x=sph.radius*Math.sin(sph.phi)*Math.sin(sph.theta);
  const y=sph.radius*Math.cos(sph.phi);
  const z=sph.radius*Math.sin(sph.phi)*Math.cos(sph.theta);
  camera.position.set(x+pan.x,y+pan.y,z);
  camera.lookAt(pan.x,pan.y,0);
}

const cv=renderer.domElement;
cv.addEventListener('mousedown',e=>{isDragging=true;isRight=e.button===2;prevX=e.clientX;prevY=e.clientY;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  const dx=e.clientX-prevX,dy=e.clientY-prevY;prevX=e.clientX;prevY=e.clientY;
  if(isRight){const s=0.002*sph.radius;tpan.x-=dx*s;tpan.y+=dy*s;}
  else{tgt.theta-=dx*0.008;tgt.phi=Math.max(0.05,Math.min(Math.PI-0.05,tgt.phi-dy*0.008));}
});
window.addEventListener('mouseup',()=>isDragging=false);
cv.addEventListener('wheel',e=>{e.preventDefault();tgt.radius=Math.max(0.3,Math.min(20,tgt.radius*(1+e.deltaY*0.001)));},{passive:false});

let touches=[];
cv.addEventListener('touchstart',e=>{touches=[...e.touches];},{passive:true});
cv.addEventListener('touchmove',e=>{
  if(e.touches.length===1){
    const dx=e.touches[0].clientX-touches[0].clientX,dy=e.touches[0].clientY-touches[0].clientY;
    tgt.theta-=dx*0.008;tgt.phi=Math.max(0.05,Math.min(Math.PI-0.05,tgt.phi-dy*0.008));
  }else if(e.touches.length===2){
    const pd=Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY);
    const nd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    tgt.radius=Math.max(0.3,Math.min(20,tgt.radius*pd/nd));
  }
  touches=[...e.touches];
},{passive:true});

const draco=new THREE.DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
const loader=new THREE.GLTFLoader();
loader.setDRACOLoader(draco);
loader.load('smartpen.glb',
  gltf=>{
    const m=gltf.scene;
    const box=new THREE.Box3().setFromObject(m);
    const sz=box.getSize(new THREE.Vector3());
    const cn=box.getCenter(new THREE.Vector3());
    const sc=2.0/Math.max(sz.x,sz.y,sz.z);
    m.scale.setScalar(sc);
    m.position.sub(cn.multiplyScalar(sc));
    m.rotation.x=-Math.PI/2;
    scene.add(m); window._model=m;
    tgt.radius=sph.radius=2.5;
    document.getElementById('loading').style.display='none';
    const h=document.getElementById('hint');
    h.classList.add('show');setTimeout(()=>h.classList.remove('show'),3000);
  },
  p=>{if(p.total>0){const pct=p.loaded/p.total*100;document.getElementById('load-bar').style.width=pct+'%';document.getElementById('load-text').textContent=`로딩중 ${Math.round(pct)}%`;}},
  e=>{document.getElementById('load-text').textContent='오류: '+e.message;}
);

const VIEWS={front:{t:0,p:Math.PI/2,r:2.5},back:{t:Math.PI,p:Math.PI/2,r:2.5},left:{t:-Math.PI/2,p:Math.PI/2,r:2.5},right:{t:Math.PI/2,p:Math.PI/2,r:2.5},top:{t:0,p:0.05,r:2.5},iso:{t:Math.PI/4,p:Math.PI/3,r:3}};
document.querySelectorAll('.preset-btn').forEach(b=>b.addEventListener('click',()=>{const v=VIEWS[b.dataset.view];if(v){tgt.theta=v.t;tgt.phi=v.p;tgt.radius=v.r;tpan={x:0,y:0};}}));
document.getElementById('reset-btn').addEventListener('click',()=>{tgt={theta:0.3,phi:Math.PI/2.5,radius:2.5};tpan={x:0,y:0};});

let wire=false;
document.getElementById('wire-btn').addEventListener('click',()=>{
  wire=!wire;
  if(window._model)window._model.traverse(c=>{if(c.isMesh&&c.material){(Array.isArray(c.material)?c.material:[c.material]).forEach(m=>m.wireframe=wire);}});
  document.getElementById('wire-btn').textContent=wire?'● 솔리드':'◻ 와이어프레임';
});

document.querySelectorAll('.bdot').forEach(d=>d.addEventListener('click',()=>{
  document.querySelectorAll('.bdot').forEach(x=>x.classList.remove('on'));
  d.classList.add('on');
  scene.background=new THREE.Color(d.dataset.color);
  document.body.style.background=d.dataset.color;
}));

window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});

function animate(){requestAnimationFrame(animate);updateCam();renderer.render(scene,camera);}
animate();
</script>
</body>
</html>
